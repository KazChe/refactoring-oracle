[project]
name = "refactoring-oracle"
version = "0.1.0"
description = "A fixture of Python refactoring cases and a deterministic grader for candidate refactorings"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.12",
    "pytest>=8.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[project.scripts]
ro-grade = "refactoring_oracle.cli:grade_main"
ro-selfcheck = "refactoring_oracle.cli:selfcheck_main"
ro-freeze = "refactoring_oracle.cli:freeze_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/refactoring_oracle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["cases"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
